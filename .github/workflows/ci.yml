name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm check
      - name: OpenAI model-router unit gate
        run: pnpm exec vitest run server/pastoral/modelRouter.openai.test.ts
      # The repository's full integration suite requires a configured test
      # database and remains an environment-level gate outside this job.
